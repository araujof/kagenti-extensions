# Daily install-stats snapshot.
#
# Records per-platform release-asset download counts to a time series on the
# gh-pages branch, where the static page in docs/install-stats/ renders it.
#
# GitHub reports download_count as a lifetime total, so a daily figure only
# exists as the difference between two snapshots -- hence the daily cron and the
# committed history. There is no way to backfill: the series starts at the first
# successful run.
#
# Publishes to gh-pages rather than committing to main so the daily commits do
# not churn main's history or trigger CI on every snapshot.
name: Install Stats

on:
  schedule:
    # 03:17 UTC. Off the hour deliberately: GitHub drops scheduled runs when the
    # whole fleet piles onto :00, and a missed run here is a permanent hole in
    # the series rather than something the next run can recover.
    - cron: '17 3 * * *'
  workflow_dispatch:

# Snapshots are idempotent per date, but two concurrent runs would still race on
# the gh-pages push. Queue them instead.
concurrency:
  group: install-stats
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit the snapshot to gh-pages
      # Required by the collector's workflow-runs query, which supplies the CI
      # count. Without it that request 403s, the collector falls back to "no CI
      # data", and the page publishes install figures with nothing subtracted --
      # silently, on every run, because the fallback is not an error.
      actions: read
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        # Default depth is enough: this job reads main's tip for the collector and
        # the page template, and fetches gh-pages separately at --depth=1. No step
        # here walks main's history.

      - name: Collect snapshot and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Materialise gh-pages in a worktree. The branch is created as an
          # orphan on first run so it carries only the published page, not a
          # copy of main's history.
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch --depth=1 origin gh-pages
            git worktree add .pages FETCH_HEAD
            # The local branch may or may not already exist, depending on whether
            # this runner has a warm checkout. Ask, rather than attempting the
            # create and discarding its stderr -- suppressing it here would also
            # hide an unrelated failure, which is exactly what you need to see
            # when this step misbehaves.
            if git -C .pages show-ref --verify --quiet refs/heads/gh-pages; then
              git -C .pages switch gh-pages
            else
              git -C .pages switch -c gh-pages
            fi
          else
            echo "gh-pages does not exist yet; creating it"
            git worktree add --detach .pages
            git -C .pages switch --orphan gh-pages
            git -C .pages rm -rqf . 2>/dev/null || true
          fi

          mkdir -p .pages/install-stats

          # Refresh the page template on every run so edits to index.html on
          # main reach the published site without a separate deploy step.
          cp docs/install-stats/index.html .pages/install-stats/index.html

          # Jekyll would otherwise skip directories it considers special and can
          # reject the build outright; this page is already static.
          touch .pages/.nojekyll

          ./scripts/collect-install-stats.sh \
            --out .pages/install-stats/data.json

          cd .pages
          git add install-stats/data.json install-stats/index.html .nojekyll

          # Nothing to commit is the normal outcome of a same-day re-run, not a
          # failure: the snapshot replaced an identical one.
          if git diff --cached --quiet; then
            echo "no change to publish"
            exit 0
          fi

          git commit -m "chore(stats): install snapshot $(date -u +%Y-%m-%d)"
          git push origin gh-pages
